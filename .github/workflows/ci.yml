name: CI

on:
  push:
    branches: [ main, Allure ]
  pull_request:
    branches: [ main, Allure ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'       # adjust if your project uses a different version
          cache: maven

      - name: Build & test with Maven
        run: mvn -B verify         # or `mvn -B test` if you only want tests
